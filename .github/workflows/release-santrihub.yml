name: Release SantriHub

# Push a tag like v0.2.0 (matching package.json "version") to publish
# SantriHub-Setup.exe to GitHub Releases. Run manually (workflow_dispatch) to
# build and test without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-santrihub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != package.json v$version" }

      - name: Tests
        run: |
          npm test
          node --test test/extension.test.js test/extension-security.test.js test/extension-member-flow.test.js test/extension-gemini-install.test.js

      - name: Build SantriHub.exe
        run: node scripts/build-santrihub.js

      - name: Smoke test SantriHub.exe
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $p = Start-Process dist\SantriHub.exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput dist\version.txt
          $got = (Get-Content dist\version.txt -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $got -ne $version) { throw "SantriHub.exe --version returned '$got' (exit $($p.ExitCode))" }
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          Set-Content dist\mcp-in.txt $init -NoNewline
          $p = Start-Process dist\SantriHub.exe -ArgumentList 'mcp-serve' -NoNewWindow -Wait -PassThru -RedirectStandardInput dist\mcp-in.txt -RedirectStandardOutput dist\mcp-out.txt
          if (-not (Select-String -Path dist\mcp-out.txt -Pattern '"serverInfo"' -Quiet)) { throw 'MCP stdio smoke test failed' }
          Remove-Item dist\version.txt, dist\mcp-in.txt, dist\mcp-out.txt

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$version" installer\santrihub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Installer smoke test (silent install + uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SantriHub'
          $p = Start-Process dist\SantriHub-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\SantriHub.exe")) { throw "Install failed ($($p.ExitCode))" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\SantriHub.exe") { throw 'Uninstall left SantriHub.exe behind' }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist\SantriHub-Setup.exe, dist\SantriHub.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SantriHub-windows
          path: |
            dist/SantriHub-Setup.exe
            dist/SantriHub.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @"
          ## SantriHub $tag untuk Windows

          **Download:** ``SantriHub-Setup.exe`` (Windows 10/11 x64, tanpa hak administrator, tidak perlu Node.js/Git).

          Login memakai akun **Member Premium Santriverse**; akses diverifikasi ke API Santriverse setiap kali dipakai.

          Link tetap versi terbaru: https://github.com/${{ github.repository }}/releases/latest/download/SantriHub-Setup.exe

          Windows SmartScreen dapat menampilkan peringatan karena installer belum ditandatangani sertifikat: pilih **More info → Run anyway**. Cocokkan SHA-256 dengan ``SHA256SUMS.txt``.
          "@
          gh release create $tag dist/SantriHub-Setup.exe dist/SantriHub.exe dist/SHA256SUMS.txt --title "SantriHub $tag" --notes $notes
